<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2D2A26" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#paperGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#E6DFD3" stroke-width="2"/>

  <!-- Journal Paper Page -->
  <g filter="url(#softShadow)">
    <rect x="116" y="96" width="280" height="320" rx="20" fill="#FFFFFF" stroke="#E2DBD0" stroke-width="2"/>
    
    <!-- Red margin rule line (classic journal margin) -->
    <line x1="172" y1="96" x2="172" y2="416" stroke="#E4C1B6" stroke-width="2" stroke-dasharray="2 4"/>

    <!-- 3 Morning Pages Ruling Lines -->
    <line x1="192" y1="168" x2="360" y2="168" stroke="#D3CBC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="216" x2="360" y2="216" stroke="#D3CBC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="264" x2="330" y2="264" stroke="#D3CBC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="312" x2="350" y2="312" stroke="#D3CBC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="360" x2="310" y2="360" stroke="#D3CBC0" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtle bookmark ribbon -->
    <path d="M 336 96 L 336 180 L 320 166 L 304 180 L 304 96 Z" fill="#A45A42"/>

    <!-- Completed Morning Pages Stamp / Emblem (Sage Green) -->
    <circle cx="216" cy="168" r="14" fill="#3F5E4D"/>
    <path d="M 211 168 L 214.5 172 L 221.5 163" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="216" cy="216" r="14" fill="#3F5E4D"/>
    <path d="M 211 216 L 214.5 220 L 221.5 211" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="216" cy="264" r="14" fill="#3F5E4D"/>
    <path d="M 211 264 L 214.5 268 L 221.5 259" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sun / Morning Spark Symbol -->
  <g transform="translate(142, 60)">
    <circle cx="0" cy="0" r="12" fill="#D68A48"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D68A48" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>
